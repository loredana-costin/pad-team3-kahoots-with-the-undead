# Prometheus for the team compose: scrapes the message broker and every replica of Player, Game, Base and Crafting Service.
# A replicated service is found through Docker's DNS: its compose name resolves to one A record per replica,
# so each replica is its own target (instance = ip:port).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: message-broker
    static_configs:
      - targets: ["message-broker:8600"]

  - job_name: player-service
    dns_sd_configs:
      - names: ["player-service"]
        type: A
        port: 8080

  - job_name: game-service
    dns_sd_configs:
      - names: ["game-service"]
        type: A
        port: 8080

  - job_name: base-service
    dns_sd_configs:
      - names: ["base-service"]
        type: A
        port: 5003

  - job_name: crafting-service
    dns_sd_configs:
      - names: ["crafting-service"]
        type: A
        port: 5004
