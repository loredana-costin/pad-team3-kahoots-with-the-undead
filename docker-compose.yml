    container_name: world-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: world_db
    command:
      - sh
      - -c
      - |
        docker-entrypoint.sh postgres -c wal_level=replica -c hot_standby=on -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby_feedback=on -c wal_keep_size=64MB &
        PG_PID=$$!
        until pg_isready -U postgres -d world_db; do sleep 1; done
        if ! grep -q "host replication all" /var/lib/postgresql/data/pg_hba.conf; then
          echo "host replication all 0.0.0.0/0 trust" >> /var/lib/postgresql/data/pg_hba.conf
          psql -U postgres -d world_db -c "SELECT pg_reload_conf();"
        fi
        wait $$PG_PID
    ports:
      - "5434:5432"
    volumes:
      - world_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d world_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      kahoots-network:
        aliases:
          - world-db-primary

  world-db-replica-1:
    image: postgres:16-alpine
    container_name: world-db-replica-1
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: world_db
    command:
      - sh
      - -c
      - |
        export PGPASSWORD=postgres
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          until pg_isready -h world-db -p 5432 -U postgres; do sleep 1; done
          rm -rf /var/lib/postgresql/data/*
          until pg_basebackup -h world-db -p 5432 -U postgres -D /var/lib/postgresql/data -Fp -Xs -P -R; do
            sleep 1
          done
          chmod 0700 /var/lib/postgresql/data
        fi
        exec docker-entrypoint.sh postgres -c wal_level=replica -c hot_standby=on -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby_feedback=on -c wal_keep_size=64MB
    volumes:
