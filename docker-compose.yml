services:
  # --- PostgreSQL Databases ---
  exam-db:
    image: postgres:16-alpine
    container_name: exam-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exam_db
    ports:
      - "5433:5432"
    volumes:
      - exam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  world-db:
    image: postgres:16-alpine
    container_name: world-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: world_db
    ports:
      - "5434:5432"
    volumes:
      - world_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d world_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  player-db:
    image: postgres:17-alpine
    container_name: player-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: player_db
    ports:
      - "5435:5432"
    volumes:
      - player_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d player_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  game-db:
    image: postgres:17-alpine
    container_name: game-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game_db
    ports:
      - "5436:5432"
    volumes:
      - game_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  resource-db:
    image: postgres:17-alpine
    container_name: resource-db
    restart: always
    environment:
      POSTGRES_USER: ${RESOURCE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD:-postgres}
      POSTGRES_DB: resource_db
    ports:
      - "5437:5432"
    volumes:
      - resource_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d resource_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  # --- MongoDB Database ---
  zombie-db:
    image: mongo:8
    container_name: zombie-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - zombie_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  base-db:
    image: postgres:16-alpine
    container_name: base-db
    restart: always
    environment:
      POSTGRES_USER: ${BASE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${BASE_DB_PASSWORD:-postgres}
      POSTGRES_DB: base_db
    ports:
      - "5438:5432"
    volumes:
      - base_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d base_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  crafting-db:
    image: postgres:16-alpine
    container_name: crafting-db
    restart: always
    environment:
      POSTGRES_USER: ${CRAFTING_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CRAFTING_DB_PASSWORD:-postgres}
      POSTGRES_DB: crafting_db
    ports:
      - "5439:5432"
    volumes:
      - crafting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d crafting_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  # --- Microservices (using uploaded DockerHub images) ---
  discovery-service:
    image: mariaelenabotnari/service-discovery:4.0.0
    container_name: discovery-service
    restart: always
    environment:
      PORT: 8500
      # Health alerts go to the developers' Discord and/or Telegram when these are set in .env (secrets, never committed).
      ALERT_DISCORD_WEBHOOK_URL: ${ALERT_DISCORD_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
    ports:
      - "8500:8500"
    expose:
      - "8500"
    networks:
      - kahoots-network

  # The Gateway sends every request to the broker's service queues over HTTP (8600) and the services call
  # each other through it over gRPC (8601); it looks the instances up in Service Discovery. 8600 is published
  # for the demo: the log download (X-Admin-Key) and the Postman event requests, which publish on a topic.
  message-broker:
    image: mariaelenabotnari/message-broker:4.1.0
    container_name: message-broker
    restart: always
    environment:
      PORT: 8600
      GRPC_PORT: 8601
      SERVICE_DISCOVERY_URL: http://discovery-service:8500
      JWT_SECRET: team-compose-development-secret-at-least-32-chars
      # Key for GET /logs/download; the download is off while it is empty (set it in .env, never commit it).
      LOGS_ADMIN_KEY: ${LOGS_ADMIN_KEY:-}
      # Durable queues: undelivered events and dead letters survive restarts in this volume.
      QUEUE_STORE_PATH: /app/data/messages.db
    volumes:
      - broker_data:/app/data
    ports:
      - "8600:8600"
    expose:
      - "8601"
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - kahoots-network

  # No container_name: 3 replicas share exam-db, where exams and attempts live, so any replica can
  # serve any request. Each registers its own address with Service Discovery; the Gateway reads it
  # to spread requests over them, and each replica looks up World Service there for its ExamPassed events.
  exam-service:
    image: mariaelenabotnari/exam-service:4.0.0
    restart: always
    deploy:
      replicas: 3
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: exam-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: exam_db
      DATABASE_URL: "postgresql://postgres:postgres@exam-db:5432/exam_db?schema=public"
      DISCOVERY_URL: http://discovery-service:8500
      BROKER_URL: http://message-broker:8600
      BROKER_GRPC_URL: message-broker:8601
      JWT_SECRET: team-compose-development-secret-at-least-32-chars
    expose:
      - "3000"
    depends_on:
      exam-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - kahoots-network

  # No container_name: 3 replicas share world-db, where zones and rooms live, so any replica can serve
  # any request. Each registers its own address with Service Discovery, which the Gateway and Exam Service read.
  world-service:
    image: mariaelenabotnari/world-service:4.0.0
    restart: always
    deploy:
      replicas: 3
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: world-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: world_db
      DATABASE_URL: "postgresql://postgres:postgres@world-db:5432/world_db?schema=public"
      DISCOVERY_URL: http://discovery-service:8500
      BROKER_URL: http://message-broker:8600
      JWT_SECRET: team-compose-development-secret-at-least-32-chars
    expose:
      - "3001"
    depends_on:
      world-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - kahoots-network

  # No container_name: 3 replicas share player-db, and each registers its own address with
  # Service Discovery, which the Gateway reads to spread requests over them (round robin).
  player-service:
    image: andrei045/player-service:4.0.0
    restart: always
    deploy:
      replicas: 3
    environment:
      ConnectionStrings__Postgres: "Host=player-db;Port=5432;Database=player_db;Username=postgres;Password=postgres"
      Jwt__Secret: "team-compose-development-secret-at-least-32-chars"
      Jwt__Issuer: player-service
      Jwt__Audience: kahoots-with-the-undead
      ASPNETCORE_ENVIRONMENT: Development
      Discovery__Url: http://discovery-service:8500
    expose:
      - "8080"
    depends_on:
      player-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - kahoots-network

  # No container_name: 3 replicas share game-db, where sessions, actions and socket tickets live,
  # so any replica can serve any request. Each registers its own address with Service Discovery.
  game-service:
    image: andrei045/game-service:4.0.0
    restart: always
    deploy:
      replicas: 3
    environment:
      ConnectionStrings__Postgres: "Host=game-db;Port=5432;Database=game_db;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development
      Services__World: http://gateway-service:8000
      Services__Zombie: http://gateway-service:8000
      Integrations__MockedServices: ""
      Services__Resource: http://gateway-service:8000
      Services__Base: http://gateway-service:8000
      Services__Exam: http://gateway-service:8000
      # Calls to the other services go to the message broker over gRPC (Broker.Relay); the Services__* URLs
      # above are the fallback of an image without broker support.
      Broker__Url: http://message-broker:8601
      # Signs Game Service's own calls through the broker; same secret as Player Service, the Gateway and the broker.
      Jwt__Secret: "team-compose-development-secret-at-least-32-chars"
      Jwt__Issuer: player-service
      Jwt__Audience: kahoots-with-the-undead
      # The URL clients get from POST /api/sessions/{id}/websocket; the socket port is the
      # only one published, REST stays behind the Gateway. Each replica takes one host port of
      # 3003-3005; tickets are shared in game-db, so the replica on 3003 accepts any of them.
      WebSocket__PublicBaseUrl: ws://localhost:3003
      Discovery__Url: http://discovery-service:8500
    ports:
      - "3003-3005:8081"
    expose:
      - "8080"
    depends_on:
      game-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    networks:
      - kahoots-network

  # No container_name: 3 replicas share resource-db, and each registers its own address with
  # Service Discovery, which the Gateway reads to spread requests over them (round robin).
  # Idempotency keys and the table bootstrap are safe across replicas (resource-service #248, #249).
  resource-service:
    image: costinloredana/resource-service:4.0.0
    deploy:
      replicas: 3
    restart: always
    environment:
      PORT: 4002
      POSTGRES_HOST: resource-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${RESOURCE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD:-postgres}
      POSTGRES_DB: resource_db
      DISCOVERY_URL: http://discovery-service:8500
    # Internal only: reachable through the gateway on :8000
    expose:
      - "4002"
    depends_on:
      resource-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - kahoots-network

  # No container_name: 3 replicas share zombie-db, and each registers its own address with
  # Service Discovery, which the Gateway reads to spread requests over them (round robin).
  zombie-service:
    image: costinloredana/zombie-service:4.0.0
    deploy:
      replicas: 3
    restart: always
    environment:
      PORT: 4001
      MONGO_URI: "mongodb://zombie-db:27017/zombie_db"
      DISCOVERY_URL: http://discovery-service:8500
    # Internal only: reachable through the gateway on :8000
    expose:
      - "4001"
    depends_on:
      zombie-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - kahoots-network

  base-service:
    image: cristi150404/base-service:4.0.0
    # No container_name: 3 replicas share the base-db database, and each registers its own address
    # with Service Discovery, which the Gateway reads to spread requests over them (round robin).
    deploy:
      replicas: 3
    restart: always
    environment:
      POSTGRES_HOST: base-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${BASE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${BASE_DB_PASSWORD:-postgres}
      POSTGRES_DB: base_db
      Integrations__UseMocks: "false"
      Services__Resource: http://gateway-service:8000
      Services__Player: http://gateway-service:8000
      Services__World: http://gateway-service:8000
      # Calls to the other services go to the message broker over gRPC (Broker.Relay), and events are
      # published on its topics; the Services__* URLs above are the fallback when Broker__Url is empty.
      Broker__Url: http://message-broker:8601
      # Signs the service token the broker accepts; same value as the Gateway's and the broker's JWT_SECRET.
      Jwt__Secret: team-compose-development-secret-at-least-32-chars
      ASPNETCORE_ENVIRONMENT: Development
      Discovery__Url: http://discovery-service:8500
      # Key for GET /logs/download; the download is off while it is empty (set it in .env, never commit it).
      Logs__AdminKey: ${LOGS_ADMIN_KEY:-}
    expose:
      - "5003"
    depends_on:
      base-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    networks:
      - kahoots-network

  crafting-service:
    image: cristi150404/crafting-service:4.0.0
    # No container_name: 3 replicas share the crafting-db database, and each registers its own address
    # with Service Discovery, which the Gateway reads to spread requests over them (round robin).
    deploy:
      replicas: 3
    restart: always
    environment:
      POSTGRES_HOST: crafting-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${CRAFTING_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CRAFTING_DB_PASSWORD:-postgres}
      POSTGRES_DB: crafting_db
      Integrations__UseMocks: "false"
      Services__Resource: http://gateway-service:8000
      Services__Player: http://gateway-service:8000
      Services__Exam: http://gateway-service:8000
      Services__World: http://gateway-service:8000
      # Calls to the other services go to the message broker over gRPC (Broker.Relay), and events are
      # published on its topics; the Services__* URLs above are the fallback when Broker__Url is empty.
      Broker__Url: http://message-broker:8601
      # Signs the service token the broker accepts; same value as the Gateway's and the broker's JWT_SECRET.
      Jwt__Secret: team-compose-development-secret-at-least-32-chars
      ASPNETCORE_ENVIRONMENT: Development
      Discovery__Url: http://discovery-service:8500
      # Key for GET /logs/download; the download is off while it is empty (set it in .env, never commit it).
      Logs__AdminKey: ${LOGS_ADMIN_KEY:-}
    expose:
      - "5004"
    depends_on:
      crafting-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    networks:
      - kahoots-network

  gateway-service:
    image: mariaelenabotnari/gateway-service:4.0.0
    container_name: gateway-service
    restart: always
    environment:
      PORT: 8000
      JWT_SECRET: team-compose-development-secret-at-least-32-chars
      EXAM_SERVICE_URL: http://exam-service:3000
      WORLD_SERVICE_URL: http://world-service:3001
      PLAYER_SERVICE_URL: http://player-service:8080
      GAME_SERVICE_URL: http://game-service:8080
      ZOMBIE_SERVICE_URL: http://zombie-service:4001
      BASE_SERVICE_URL: http://base-service:5003
      CRAFTING_SERVICE_URL: http://crafting-service:5004
      RESOURCE_SERVICE_URL: http://resource-service:4002
      # The services listed here are looked up in Service Discovery and get requests in turn;
      # a service with no registered instance falls back to its *_SERVICE_URL above.
      DISCOVERY_URL: http://discovery-service:8500
      DISCOVERY_SERVICES: zombie-service,resource-service,base-service,crafting-service,player-service,game-service,exam-service,world-service
      # Every request goes to the broker's queue of the target service; the broker balances and breaks circuits.
      BROKER_URL: http://message-broker:8600
    ports:
      - "8000:8000"
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - kahoots-network

  # --- Monitoring: Prometheus scrapes the metrics, Alloy ships the container logs to Loki, Grafana shows both ---
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - kahoots-network

  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    expose:
      - "3100"
    networks:
      - kahoots-network

  alloy:
    image: grafana/alloy:v1.8.1
    container_name: alloy
    restart: always
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only access to the Docker socket, to find the containers and read their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - kahoots-network

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - kahoots-network

volumes:
  broker_data:
    driver: local
  base_postgres_data:
    driver: local
  crafting_postgres_data:
    driver: local
  player_postgres_data:
    driver: local
  game_postgres_data:
    driver: local
  exam_postgres_data:
    driver: local
  world_postgres_data:
    driver: local
  resource_postgres_data:
    driver: local
  zombie_mongo_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local

networks:
  kahoots-network:
    driver: bridge
