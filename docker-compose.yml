services:
  # --- PostgreSQL Databases ---
  exam-db:
    image: postgres:16-alpine
    container_name: exam-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exam_db
    ports:
      - "5433:5432"
    volumes:
      - exam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  world-db:
    image: postgres:16-alpine
    container_name: world-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: world_db
    ports:
      - "5434:5432"
    volumes:
      - world_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d world_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  player-db:
    image: postgres:17-alpine
    container_name: player-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: player_db
    ports:
      - "5435:5432"
    volumes:
      - player_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d player_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  game-db:
    image: postgres:17-alpine
    container_name: game-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game_db
    ports:
      - "5436:5432"
    volumes:
      - game_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  resource-db:
    image: postgres:17-alpine
    container_name: resource-db
    restart: always
    environment:
      POSTGRES_USER: ${RESOURCE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD:-postgres}
      POSTGRES_DB: resource_db
    ports:
      - "5437:5432"
    volumes:
      - resource_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d resource_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  # --- MongoDB Database ---
  zombie-db:
    image: mongo:8
    container_name: zombie-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - zombie_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  base-db:
    image: postgres:16-alpine
    container_name: base-db
    restart: always
    environment:
      POSTGRES_USER: ${BASE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${BASE_DB_PASSWORD:-postgres}
      POSTGRES_DB: base_db
    ports:
      - "5438:5432"
    volumes:
      - base_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d base_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  crafting-db:
    image: postgres:16-alpine
    container_name: crafting-db
    restart: always
    environment:
      POSTGRES_USER: ${CRAFTING_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CRAFTING_DB_PASSWORD:-postgres}
      POSTGRES_DB: crafting_db
    ports:
      - "5439:5432"
    volumes:
      - crafting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d crafting_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  # --- Microservices (using uploaded DockerHub images) ---
  discovery-service:
    image: mariaelenabotnari/service-discovery:lab3
    container_name: discovery-service
    restart: always
    environment:
      PORT: 8500
      # Health alerts go to the developers' Discord and/or Telegram when these are set in .env (secrets, never committed).
      ALERT_DISCORD_WEBHOOK_URL: ${ALERT_DISCORD_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
    expose:
      - "8500"
    networks:
      - kahoots-network

  # No container_name: 3 replicas share exam-db, where exams and attempts live, so any replica can
  # serve any request. Each registers its own address with Service Discovery; the Gateway reads it
  # to spread requests over them, and each replica looks up World Service there for its ExamPassed events.
  exam-service:
    image: mariaelenabotnari/exam-service:lab3
    restart: always
    deploy:
      replicas: 3
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: exam-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: exam_db
      DATABASE_URL: "postgresql://postgres:postgres@exam-db:5432/exam_db?schema=public"
      DISCOVERY_URL: http://discovery-service:8500
    expose:
      - "3000"
    depends_on:
      exam-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - kahoots-network

  # No container_name: 3 replicas share world-db, where zones and rooms live, so any replica can serve
  # any request. Each registers its own address with Service Discovery, which the Gateway and Exam Service read.
  world-service:
    image: mariaelenabotnari/world-service:lab3
    restart: always
    deploy:
      replicas: 3
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: world-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: world_db
      DATABASE_URL: "postgresql://postgres:postgres@world-db:5432/world_db?schema=public"
      DISCOVERY_URL: http://discovery-service:8500
    expose:
      - "3001"
    depends_on:
      world-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - kahoots-network

  # No container_name: 3 replicas share player-db, and each registers its own address with
  # Service Discovery, which the Gateway reads to spread requests over them (round robin).
  player-service:
    image: andrei045/player-service:3.0.0
    restart: always
    deploy:
      replicas: 3
    environment:
      ConnectionStrings__Postgres: "Host=player-db;Port=5432;Database=player_db;Username=postgres;Password=postgres"
      Jwt__Secret: "team-compose-development-secret-at-least-32-chars"
      Jwt__Issuer: player-service
      Jwt__Audience: kahoots-with-the-undead
      ASPNETCORE_ENVIRONMENT: Development
      Discovery__Url: http://discovery-service:8500
    expose:
      - "8080"
    depends_on:
      player-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - kahoots-network

  # No container_name: 3 replicas share game-db, where sessions, actions and socket tickets live,
  # so any replica can serve any request. Each registers its own address with Service Discovery.
  game-service:
    image: andrei045/game-service:3.0.0
    restart: always
    deploy:
      replicas: 3
    environment:
      ConnectionStrings__Postgres: "Host=game-db;Port=5432;Database=game_db;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development
      Services__World: http://gateway-service:8000
      Services__Zombie: http://gateway-service:8000
      Integrations__MockedServices: ""
      Services__Resource: http://gateway-service:8000
      Services__Base: http://gateway-service:8000
      Services__Exam: http://gateway-service:8000
      # Signs Game Service's own calls through the Gateway; same secret as Player Service and the Gateway.
      Jwt__Secret: "team-compose-development-secret-at-least-32-chars"
      Jwt__Issuer: player-service
      Jwt__Audience: kahoots-with-the-undead
      # The URL clients get from POST /api/sessions/{id}/websocket; the socket port is the
      # only one published, REST stays behind the Gateway. Each replica takes one host port of
      # 3003-3005; tickets are shared in game-db, so the replica on 3003 accepts any of them.
      WebSocket__PublicBaseUrl: ws://localhost:3003
      Discovery__Url: http://discovery-service:8500
    ports:
      - "3003-3005:8081"
    expose:
      - "8080"
    depends_on:
      game-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - kahoots-network

  resource-service:
    image: costinloredana/resource-service:2.0.0
    container_name: resource-service
    restart: always
    environment:
      PORT: 4002
      POSTGRES_HOST: resource-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${RESOURCE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD:-postgres}
      POSTGRES_DB: resource_db
    # Internal only: reachable through the gateway on :8000
    expose:
      - "4002"
    depends_on:
      resource-db:
        condition: service_healthy
    networks:
      - kahoots-network

  zombie-service:
    image: costinloredana/zombie-service:2.0.0
    container_name: zombie-service
    restart: always
    environment:
      PORT: 4001
      MONGO_URI: "mongodb://zombie-db:27017/zombie_db"
    # Internal only: reachable through the gateway on :8000
    expose:
      - "4001"
    depends_on:
      zombie-db:
        condition: service_healthy
    networks:
      - kahoots-network

  base-service:
    image: cristi150404/base-service:3.0.0
    # No container_name: 3 replicas share the base-db database, and each registers its own address
    # with Service Discovery, which the Gateway reads to spread requests over them (round robin).
    deploy:
      replicas: 3
    restart: always
    environment:
      POSTGRES_HOST: base-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${BASE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${BASE_DB_PASSWORD:-postgres}
      POSTGRES_DB: base_db
      Integrations__UseMocks: "false"
      Services__Resource: http://gateway-service:8000
      Services__Player: http://gateway-service:8000
      Services__World: http://gateway-service:8000
      # Signs the service token the Gateway accepts; same value as the Gateway's JWT_SECRET.
      Jwt__Secret: team-compose-development-secret-at-least-32-chars
      ASPNETCORE_ENVIRONMENT: Development
      Discovery__Url: http://discovery-service:8500
    expose:
      - "5003"
    depends_on:
      base-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - kahoots-network

  crafting-service:
    image: cristi150404/crafting-service:3.0.0
    # No container_name: 3 replicas share the crafting-db database, and each registers its own address
    # with Service Discovery, which the Gateway reads to spread requests over them (round robin).
    deploy:
      replicas: 3
    restart: always
    environment:
      POSTGRES_HOST: crafting-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${CRAFTING_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CRAFTING_DB_PASSWORD:-postgres}
      POSTGRES_DB: crafting_db
      Integrations__UseMocks: "false"
      Services__Resource: http://gateway-service:8000
      Services__Player: http://gateway-service:8000
      Services__Exam: http://gateway-service:8000
      Services__World: http://gateway-service:8000
      # Signs the service token the Gateway accepts; same value as the Gateway's JWT_SECRET.
      Jwt__Secret: team-compose-development-secret-at-least-32-chars
      ASPNETCORE_ENVIRONMENT: Development
      Discovery__Url: http://discovery-service:8500
    expose:
      - "5004"
    depends_on:
      crafting-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - kahoots-network

  gateway-service:
    image: mariaelenabotnari/gateway-service:2.4.0
    container_name: gateway-service
    restart: always
    environment:
      PORT: 8000
      JWT_SECRET: team-compose-development-secret-at-least-32-chars
      EXAM_SERVICE_URL: http://exam-service:3000
      WORLD_SERVICE_URL: http://world-service:3001
      PLAYER_SERVICE_URL: http://player-service:8080
      GAME_SERVICE_URL: http://game-service:8080
      ZOMBIE_SERVICE_URL: http://zombie-service:4001
      BASE_SERVICE_URL: http://base-service:5003
      CRAFTING_SERVICE_URL: http://crafting-service:5004
      RESOURCE_SERVICE_URL: http://resource-service:4002
      # The services listed here are looked up in Service Discovery and get requests in turn;
      # a service with no registered instance falls back to its *_SERVICE_URL above.
      DISCOVERY_URL: http://discovery-service:8500
      DISCOVERY_SERVICES: zombie-service,resource-service,base-service,crafting-service,player-service,game-service,exam-service,world-service
    ports:
      - "8000:8000"
    networks:
      - kahoots-network

volumes:
  base_postgres_data:
    driver: local
  crafting_postgres_data:
    driver: local
  player_postgres_data:
    driver: local
  game_postgres_data:
    driver: local
  exam_postgres_data:
    driver: local
  world_postgres_data:
    driver: local
  resource_postgres_data:
    driver: local
  zombie_mongo_data:
    driver: local

networks:
  kahoots-network:
    driver: bridge
