  restart: always
  command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
    interval: 5s
    timeout: 5s
    retries: 20
  networks:
    - kahoots-network

# Runs once the cluster is up and makes the replication synchronous on every node: a commit returns only after
# at least one standby has it. The image's env vars set this only on the first primary, and in a config file the
# first primary hangs at startup waiting for standbys that aren't there yet. ALTER SYSTEM writes it into each
# node's data directory, so it survives restarts and a promoted standby already has it.
x-sync-replication: &sync-replication
  image: postgres:17-alpine
  restart: "no"
  entrypoint: ["sh", "-c"]
  command:
    - |
      set -e
      for node in $$NODES; do
        psql -h $$node -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET synchronous_standby_names = 'ANY 1 (*)'" -c "SELECT pg_reload_conf()" > /dev/null
        echo "$$node: synchronous_standby_names = $$(psql -h $$node -d postgres -Atc 'SHOW synchronous_standby_names')"
      done
  networks:
    - kahoots-network

services:
  # --- PostgreSQL Databases ---
  # Exam Service and World Service databases: 1 Primary + 2 Hot-Standby Streaming Replicas each, with automatic failover.
  exam-db:
    image: postgres:16-alpine
    container_name: exam-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exam_db
    command:
      - sh
      - -c
      - |
        docker-entrypoint.sh postgres -c wal_level=replica -c hot_standby=on -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby_feedback=on -c wal_keep_size=64MB &
        PG_PID=$$!
        until pg_isready -U postgres -d exam_db; do sleep 1; done
        if ! grep -q "host replication all" /var/lib/postgresql/data/pg_hba.conf; then
          echo "host replication all 0.0.0.0/0 trust" >> /var/lib/postgresql/data/pg_hba.conf
          psql -U postgres -d exam_db -c "SELECT pg_reload_conf();"
        fi
        wait $$PG_PID
    ports:
      - "5433:5432"
    volumes:
      - exam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      kahoots-network:
        aliases:
          - exam-db-primary

  exam-db-replica-1:
    image: postgres:16-alpine
    container_name: exam-db-replica-1
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exam_db
    command:
      - sh
      - -c
      - |
        export PGPASSWORD=postgres
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          until pg_isready -h exam-db -p 5432 -U postgres; do sleep 1; done
          rm -rf /var/lib/postgresql/data/*
          until pg_basebackup -h exam-db -p 5432 -U postgres -D /var/lib/postgresql/data -Fp -Xs -P -R; do
            sleep 1
          done
          chmod 0700 /var/lib/postgresql/data
        fi
        exec docker-entrypoint.sh postgres -c wal_level=replica -c hot_standby=on -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby_feedback=on -c wal_keep_size=64MB
    volumes:
      - exam_postgres_replica_1_data:/var/lib/postgresql/data
    depends_on:
      exam-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  exam-db-replica-2:
    image: postgres:16-alpine
    container_name: exam-db-replica-2
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
