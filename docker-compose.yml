services:
  # --- PostgreSQL Databases ---
  exam-db:
    image: postgres:16-alpine
    container_name: exam-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exam_db
    ports:
      - "5433:5432"
    volumes:
      - exam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  world-db:
    image: postgres:16-alpine
    container_name: world-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: world_db
    ports:
      - "5434:5432"
    volumes:
      - world_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d world_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  player-db:
    image: postgres:17-alpine
    container_name: player-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: player_db
    ports:
      - "5435:5432"
    volumes:
      - player_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d player_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  game-db:
    image: postgres:17-alpine
    container_name: game-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game_db
    ports:
      - "5436:5432"
    volumes:
      - game_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kahoots-network

  # --- Microservices (using uploaded DockerHub images) ---
  exam-service:
    image: mariaelenabotnari/exam-service:1.0.0
    container_name: exam-service
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: exam-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: exam_db
      DATABASE_URL: "postgresql://postgres:postgres@exam-db:5432/exam_db?schema=public"
    ports:
      - "3000:3000"
    depends_on:
      exam-db:
        condition: service_healthy
    networks:
      - kahoots-network

  world-service:
    image: mariaelenabotnari/world-service:1.1.0
    container_name: world-service
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: world-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: world_db
      DATABASE_URL: "postgresql://postgres:postgres@world-db:5432/world_db?schema=public"
    ports:
      - "3001:3001"
    depends_on:
      world-db:
        condition: service_healthy
    networks:
      - kahoots-network

  player-service:
    image: andrei045/player-service:1.1.0
    container_name: player-service
    restart: always
    environment:
      ConnectionStrings__Postgres: "Host=player-db;Port=5432;Database=player_db;Username=postgres;Password=postgres"
      Jwt__Secret: "team-compose-development-secret-at-least-32-chars"
      Jwt__Issuer: player-service
      Jwt__Audience: kahoots-with-the-undead
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "3002:8080"
    depends_on:
      player-db:
        condition: service_healthy
    networks:
      - kahoots-network

  game-service:
    image: andrei045/game-service:1.1.0
    container_name: game-service
    restart: always
    environment:
      ConnectionStrings__Postgres: "Host=game-db;Port=5432;Database=game_db;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "3003:8080"
    depends_on:
      game-db:
        condition: service_healthy
    networks:
      - kahoots-network

volumes:
  player_postgres_data:
    driver: local
  game_postgres_data:
    driver: local
  exam_postgres_data:
    driver: local
  world_postgres_data:
    driver: local

networks:
  kahoots-network:
    driver: bridge
